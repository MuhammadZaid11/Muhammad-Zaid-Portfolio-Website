# ==========================================
# Docker Compose — Portfolio Full Stack
# ==========================================
# Usage:
#   docker-compose up --build
#   docker-compose down -v  (to remove volumes)
# ==========================================

version: '3.8'

services:
  # ---- Node.js Express App ----
  app:
    build: .
    container_name: portfolio-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-portfolio_user}
      - DB_PASSWORD=${DB_PASSWORD:-your_secure_password_here}
      - DB_NAME=${DB_NAME:-portfolio_db}
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_long_random_secret_string}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo '⏳ Waiting for database schema initialization...' &&
        node server/seed.js &&
        echo '🚀 Starting server...' &&
        node server/server.js
      "

  # ---- MySQL Database ----
  db:
    image: mysql:8.0
    container_name: portfolio-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your_secure_password_here}
      MYSQL_DATABASE: ${DB_NAME:-portfolio_db}
      MYSQL_USER: ${DB_USER:-portfolio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_secure_password_here}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-your_secure_password_here}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
    driver: local
